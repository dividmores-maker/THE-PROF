<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<style>
  :root{
    --gold: #e8b923;
    --gold-soft: #f4d668;
    --ink: #0a1220;
    --panel: #0a1220;
    --text-dim: rgba(255,255,255,0.65);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    font-family: -apple-system, "Segoe UI", "Cairo", "Tahoma", sans-serif;
  }

  .split{
    display: flex;
    min-height: 100vh;
    width: 100%;
  }

  /* left half — the poster */
  .split-image{
    flex: 1 1 50%;
    position: relative;
    background-color: #050a14;
    overflow: hidden;
  }

  .split-image .bg-fill{
    position: absolute;
    inset: 0;
    background-image: url("login-bg.jpeg");
    background-size: cover;
    background-position: center;
    filter: blur(30px) brightness(0.5) saturate(120%);
    transform: scale(1.1);
  }

  .split-image .bg-full{
    position: absolute;
    inset: 0;
    background-image: url("login-bg.jpeg");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  .split-image .drift{
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 25% 45%, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    opacity: 0.6;
  }

  /* right half — the form */
  .split-form{
    flex: 1 1 50%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .card{
    direction: rtl;
    width: 100%;
    max-width: 440px;
    padding: 48px 44px;
  }

  .badge{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    border: 1.5px dashed var(--gold);
    border-radius: 50%;
    color: var(--gold-soft);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    margin-bottom: 26px;
  }

  h1{
    color: #fff;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 8px;
  }

  .sub{
    color: var(--text-dim);
    font-size: 15.5px;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .field{
    margin-bottom: 22px;
  }

  .field label{
    display: block;
    font-size: 13.5px;
    color: var(--gold-soft);
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }

  .field input{
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 4px;
    color: #fff;
    font-size: 15.5px;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }

  .field input::placeholder{ color: rgba(255,255,255,0.35); }

  .field input:focus{
    border-color: var(--gold);
    background: rgba(255,255,255,0.09);
  }

  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    font-size: 13.5px;
  }

  .remember{
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
  }

  .remember input{ accent-color: var(--gold); width: 15px; height: 15px; }

  .row a{
    color: var(--gold-soft);
    text-decoration: none;
  }
  .row a:hover{ text-decoration: underline; }

  button.submit{
    width: 100%;
    padding: 15px;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    color: #17140a;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background .2s ease, transform .1s ease;
  }

  button.submit:hover{ background: var(--gold-soft); }
  button.submit:active{ transform: scale(0.99); }

  .footer{
    margin-top: 26px;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  .footer a{
    color: var(--gold-soft);
    text-decoration: none;
    font-weight: 600;
  }
  .footer a:hover{ text-decoration: underline; }

  .alert{
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .alert-error{
    background: rgba(220, 70, 70, 0.12);
    border: 1px solid rgba(220, 70, 70, 0.35);
    color: #ff9c9c;
  }
  .alert-success{
    background: rgba(70, 200, 130, 0.12);
    border: 1px solid rgba(70, 200, 130, 0.35);
    color: #8de8b4;
  }

  @media (max-width: 860px){
    .split{ flex-direction: column; }
    .split-image{ min-height: 40vh; }
    .split-form{ padding: 28px; }
    .card{ padding: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
  <div class="split">
    <div class="split-image">
      <div class="bg-fill"></div>
      <div class="bg-full"></div>
      <div class="drift"></div>
    </div>

    <div class="split-form">
      <form class="card" id="loginForm" onsubmit="return false;">
        <div class="badge">FULL<br>MARK</div>
        <h1>تسجيل الدخول</h1>
        <p class="sub">اهلاً بيك تاني، دخل بياناتك عشان تكمل.</p>

        <div id="errorMsg" class="alert alert-error">
          <span>⚠️</span><span id="errorText"></span>
        </div>
        <div id="successMsg" class="alert alert-success">
          <span>✅</span><span id="successText"></span>
        </div>

        <div class="field">
          <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
          <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember">
            فاكرني
          </label>
          <a href="#" id="forgotLink">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">دخول</button>

        <p class="footer">© 2026 — جميع الحقوق محفوظة</p>
      </form>
    </div>
  </div>

  <script>
    const validUsers = { 'admin':'500', 'RAMY ABO NOUR':'G142012a', 'ASSISTANT1':'135792468', 'ASSISTANT2':'246813579', 'GOMANA':'G142012a' };

    function showError(msg){
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').style.display = 'flex';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg){
      document.getElementById('successText').textContent = msg;
      document.getElementById('successMsg').style.display = 'flex';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', function(){
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const rem  = document.getElementById('remember').checked;

      if(!user || !pass){ showError('الرجاء إدخال اسم المستخدم وكلمة المرور'); return; }

      if(validUsers[user] && validUsers[user] === pass){
        showSuccess('تم تسجيل الدخول بنجاح! جاري التحويل...');
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('currentUser', user);
        if(rem) localStorage.setItem('rememberedUser', user);
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'جاري التحويل...';
        btn.disabled = true;
        setTimeout(() => window.location.href = 'home.html', 1500);
      } else {
        showError('اسم المستخدم أو كلمة المرور غير صحيحة!');
        document.getElementById('password').value = '';
      }
    });

    document.getElementById('forgotLink').addEventListener('click', function(e){
      e.preventDefault();
      showSuccess('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
    });
  </script>
</body>
</html>
